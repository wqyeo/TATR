# Use --file /path/to/examples/tatr.toml from any directory.
# Requires CMake and a native C++ toolchain on PATH.
# Append CTest options with: run check -- --parallel 2
version = 1

# Action records go to stderr by default. Uncomment to also append log files.
# Directory is relative to this TOML file, independently of each task's cwd.
# [logging.file]
# directory = "../build/logs"
# filename = "tatr-{date}-{time}-{pid}.log"

[tasks.configure]
description = "Configure the development build"
exec = ["cmake", "--preset", "dev"]
cwd = ".."

[tasks.build]
description = "Build the development executable"
depends = ["configure"]
exec = ["cmake", "--build", "--preset", "dev"]
cwd = ".."

[tasks.check]
description = "Check the project"
depends = ["build"]
exec = ["ctest", "--preset", "dev"]
cwd = ".."
env_file = ".env.example"
