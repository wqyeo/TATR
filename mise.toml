[tools]
cmake = "4.3.2"

[tasks.configure]
description = "Configure the development build"
run = "cmake --preset dev"

[tasks.build]
description = "Build the development executable"
depends = ["configure"]
run = "cmake --build --preset dev"

[tasks.release]
description = "Build for minimum size"
run = ["cmake --preset release", "cmake --build --preset release"]

[tasks.test]
description = "Build and test the task runner"
depends = ["build"]
run = "ctest --preset dev"

[tasks.strict]
description = "Native build and tests with strict compiler diagnostics"
run = ["cmake --preset strict", "cmake --build --preset strict", "ctest --preset strict --parallel 4"]

[tasks.format]
description = "Format project C++ using pinned LLVM in Podman"
run = "cmake -DMODE=format -P tools/container.cmake"

[tasks.format-check]
description = "Check project C++ formatting using pinned LLVM in Podman"
run = "cmake -DMODE=format-check -P tools/container.cmake"

[tasks.analyze]
description = "Run focused clang-tidy checks using pinned LLVM in Podman"
run = "cmake -DMODE=analyze -P tools/container.cmake"

[tasks.quality]
description = "Linux strict build, formatting, analysis, and tests in Podman"
run = "cmake -DMODE=quality -P tools/container.cmake"

[tasks.sanitize]
description = "Linux ASan and UBSan build and tests in Podman"
run = "cmake -DMODE=sanitize -P tools/container.cmake"
